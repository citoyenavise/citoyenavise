name: CI

on:
  push:
    branches:
      - develop
      - develop/**
  pull_request:
    branches:
      - develop

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: citoyenavise_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      - name: Run ESLint
        run: npm run lint
        working-directory: backend
        continue-on-error: true

      - name: Run tests
        run: npm run test
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/citoyenavise_test
          NODE_ENV: test

      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/citoyenavise_test
          NODE_ENV: test

      - name: Check coverage threshold
        run: |
          if [ ! -f backend/coverage/coverage-summary.json ]; then
            echo "⚠️  Coverage file not found, skipping threshold check"
            exit 0
          fi
          COVERAGE=$(node -e "const fs = require('fs'); const coverage = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json')); console.log(Math.round(coverage.total.lines.pct))")
          echo "Backend Coverage: ${COVERAGE}%"
          if [ $COVERAGE -lt 80 ]; then
            echo "❌ Coverage is below 80% threshold (${COVERAGE}%)"
            exit 1
          fi
        working-directory: backend

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ matrix.node-version }}
          path: backend/coverage/
          retention-days: 30

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: frontend
        continue-on-error: true

      - name: Run tests
        run: npm run test
        working-directory: frontend

      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: frontend

      - name: Check coverage threshold
        run: |
          if [ ! -f frontend/coverage/coverage-summary.json ]; then
            echo "⚠️  Coverage file not found, skipping threshold check"
            exit 0
          fi
          COVERAGE=$(node -e "const fs = require('fs'); const coverage = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json')); console.log(Math.round(coverage.total.lines.pct))")
          echo "Frontend Coverage: ${COVERAGE}%"
          if [ $COVERAGE -lt 80 ]; then
            echo "❌ Coverage is below 80% threshold (${COVERAGE}%)"
            exit 1
          fi
        working-directory: frontend

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ matrix.node-version }}
          path: frontend/coverage/
          retention-days: 30

  security:
    name: Security Scan with Snyk
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Snyk
        run: npm install -g snyk

      - name: Authenticate with Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Scan backend vulnerabilities
        run: snyk test --severity-threshold=high
        working-directory: backend
        continue-on-error: false

      - name: Scan frontend vulnerabilities
        run: snyk test --severity-threshold=high
        working-directory: frontend
        continue-on-error: false

      - name: Monitor backend dependencies
        run: snyk monitor --project-name=citoyenavise-backend
        working-directory: backend
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Monitor frontend dependencies
        run: snyk monitor --project-name=citoyenavise-frontend
        working-directory: frontend
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  codecov:
    name: Upload Coverage to Codecov
    runs-on: ubuntu-latest
    needs: [backend, frontend, security]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: coverage-artifacts

      - name: Upload to codecov
        uses: codecov/codecov-action@v3
        with:
          flags: unittests
          fail_ci_if_error: false
          verbose: true
