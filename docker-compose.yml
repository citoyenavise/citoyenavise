version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: citoyenavise_postgres
    environment:
      POSTGRES_USER: staging_user
      POSTGRES_PASSWORD: staging_password
      POSTGRES_DB: citoyenavise_staging
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staging_user -d citoyenavise_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - citoyenavise-network
    labels:
      - "com.example.description=Citoyenavise PostgreSQL Database"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: citoyenavise_redis
    command: redis-server --appendonly yes --requirepass ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - citoyenavise-network
    labels:
      - "com.example.description=Citoyenavise Redis Cache"

  # Node.js Backend API
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: citoyenavise_app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Load from .env.staging
      NODE_ENV: staging
      PORT: 5000
      DATABASE_URL: postgresql://staging_user:staging_password@postgres:5432/citoyenavise_staging
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: staging_user
      DB_PASSWORD: staging_password
      DB_NAME: citoyenavise_staging
      JWT_SECRET: staging_secret_key_change_in_production_12345678901234567890
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_URL: http://localhost:5000
      FRONTEND_URL: http://localhost:5173
      LOG_LEVEL: debug
      ENABLE_SWAGGER: "true"
      ENABLE_CACHE: "true"
    ports:
      - "5000:5000"
    volumes:
      # Mount source code for development
      - ./backend/src:/app/src
      - ./backend/.eslintrc.json:/app/.eslintrc.json
      - ./backend/.prettierrc.json:/app/.prettierrc.json
      # Exclude node_modules
      - /app/node_modules
    networks:
      - citoyenavise-network
    labels:
      - "com.example.description=Citoyenavise Backend API"
    restart: unless-stopped

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: citoyenavise_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - citoyenavise-network
    labels:
      - "com.example.description=pgAdmin Database Management"
    profiles:
      - debug  # Only run with: docker-compose --profile debug up

  # Optional: Redis Commander for cache management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: citoyenavise_redis_commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - citoyenavise-network
    labels:
      - "com.example.description=Redis Commander Cache Management"
    profiles:
      - debug  # Only run with: docker-compose --profile debug up

networks:
  citoyenavise-network:
    driver: bridge
    name: citoyenavise-network

volumes:
  postgres_data:
    driver: local
    name: citoyenavise_postgres_data
  redis_data:
    driver: local
    name: citoyenavise_redis_data
