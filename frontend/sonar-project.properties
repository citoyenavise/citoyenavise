# SonarQube Configuration for Citoyenavise Frontend

# Project identification
sonar.projectKey=citoyenavise-frontend
sonar.projectName=Citoyenavise Frontend React
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=src
sonar.tests=__tests__
sonar.sourceEncoding=UTF-8

# Language
sonar.language=js

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.js,**/*.test.jsx,**/__tests__/**,**/node_modules/**,**/dist/**
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/__tests__/**/*.js,**/__tests__/**/*.jsx

# Quality gate
sonar.qualitygate.wait=true

# Duplication
sonar.cpd.exclusions=**/*.test.js,**/*.test.jsx,**/node_modules/**

# Code smells and bugs
sonar.javascript.file.suffixes=.js,.jsx

# Exclusions
sonar.exclusions=node_modules/**,coverage/**,dist/**,.git/**

# React specific
sonar.javascript.node_modules.banlist=babelify,browserify,eslint,webpack

# Security
sonar.security.hotspots.skip=false
