server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets Vite (noms hashes) — cache long immuable
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback SPA — toute route inconnue renvoyee a index.html.
    # C'est ce qui rend BrowserRouter possible (URLs propres sans #).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
