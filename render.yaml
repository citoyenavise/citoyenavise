services:
  - type: web
    name: citoyenavise-backend
    runtime: node
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: citoyenavise-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
    healthCheckPath: /health
    region: frankfurt

databases:
  - name: citoyenavise-db
    databaseName: citoyenavise
    region: frankfurt
