services:
  - type: web
    name: citoyenavise-backend
    runtime: node
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: citoyenavise-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
    # Health Checks (for load balancing and auto-healing)
    # GET /health — Full status with memory, CPU, database info
    # GET /health/ready — Readiness probe (Kubernetes-style)
    # GET /health/live — Liveness probe (restart container if fails)
    healthCheckPath: /health
    healthCheckProtocol: HTTP
    healthCheckTimeout: 5
    healthCheckInterval: 30

    # Limits
    maxRequestTimeoutSeconds: 120

    # Graceful shutdown
    shutdownTimeoutSeconds: 30

    region: frankfurt

databases:
  - name: citoyenavise-db
    databaseName: citoyenavise
    region: frankfurt
