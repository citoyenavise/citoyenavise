<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil — Citoyen Avisé</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .profile-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .profile-header {
      background: white;
      border-radius: 12px;
      padding: 40px;
      margin-bottom: 30px;
      box-shadow: var(--ombre-carte);
    }

    .profile-header-top {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--rouge);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 600;
      flex-shrink: 0;
    }

    .profile-info h1 {
      font-size: 2rem;
      margin-bottom: 4px;
      color: var(--noir-doux);
    }

    .profile-username {
      color: var(--gris);
      font-size: 1.05rem;
      margin-bottom: 12px;
    }

    .profile-location {
      color: var(--gris-texte);
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    .profile-bio {
      color: var(--gris-texte);
      line-height: 1.6;
      margin-bottom: 16px;
      max-width: 500px;
    }

    .profile-stats {
      display: flex;
      gap: 24px;
      padding: 16px 0;
      border-top: 1px solid var(--gris-clair);
      border-bottom: 1px solid var(--gris-clair);
      margin-bottom: 16px;
    }

    .profile-stat {
      text-align: center;
    }

    .profile-stat-number {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--rouge);
    }

    .profile-stat-label {
      font-size: 0.8rem;
      color: var(--gris);
      text-transform: uppercase;
      margin-top: 4px;
    }

    .profile-actions {
      display: flex;
      gap: 12px;
    }

    .profile-edit {
      flex: 1;
    }

    .profile-edit-form {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 30px;
    }

    .profile-edit-form h3 {
      margin-bottom: 20px;
    }

    .profile-posts {
      background: white;
      border-radius: 12px;
      padding: 24px;
    }

    .profile-posts h3 {
      margin-bottom: 20px;
    }

    .profile-posts-empty {
      text-align: center;
      color: var(--gris);
      padding: 40px 20px;
    }

    @media (max-width: 768px) {
      .profile-header-top {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .profile-info h1 { font-size: 1.5rem; }

      .profile-stats {
        gap: 16px;
      }

      .profile-actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

<div class="profile-container">
  <!-- Header profil -->
  <div class="profile-header" id="profile-header">
    <div class="loader">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Edit form (si proprio) -->
  <div class="profile-edit-form" id="edit-form" style="display:none;">
    <h3>Éditer mon profil</h3>
    <form id="profile-form">
      <div class="form-group">
        <label for="bio" class="form-label">Bio</label>
        <textarea
          id="bio"
          class="form-control"
          placeholder="Dites-nous qui vous êtes..."
          maxlength="500"
        ></textarea>
        <div style="font-size: 0.8rem; color: var(--gris); margin-top: 4px;">
          <span id="bio-count">0</span>/500
        </div>
      </div>

      <div class="form-group">
        <label for="location" class="form-label">Localisation</label>
        <input
          type="text"
          id="location"
          class="form-control"
          placeholder="Ex: Montréal, QC"
        >
      </div>

      <div class="form-group">
        <label for="interests" class="form-label">Intérêts (comma-séparés)</label>
        <input
          type="text"
          id="interests"
          class="form-control"
          placeholder="élections, environnement, éducation"
        >
      </div>

      <button type="submit" class="btn btn-primary">Sauvegarder</button>
      <button type="button" class="btn btn-secondary" onclick="location.reload()">Annuler</button>
    </form>
  </div>

  <!-- Posts du profil -->
  <div class="profile-posts">
    <h3>Posts</h3>
    <div id="profile-posts-list" class="profile-posts-empty">
      <p>Aucun post pour le moment</p>
    </div>
  </div>
</div>

<script src="/js/utils/api.js"></script>
<script src="/js/utils/store.js"></script>
<script src="/js/utils/helpers.js"></script>
<script src="/js/components/header.js"></script>
<script>
  let currentProfileId;
  let isOwnProfile = false;

  document.addEventListener('DOMContentLoaded', async () => {
    initHeader();

    // Obtenir ID du profil depuis URL
    const pathParts = window.location.pathname.split('/');
    currentProfileId = pathParts[pathParts.length - 1];

    if (currentProfileId === 'profile') {
      // "Mon profil" - rediriger vers le vrai ID
      const user = store.getUser();
      if (!user) {
        navigate('/login');
        return;
      }
      currentProfileId = store.getProfile().id;
      isOwnProfile = true;
    } else {
      // Profil d'un autre
      const user = store.getUser();
      isOwnProfile = user && store.getProfile()?.id === currentProfileId;
    }

    await loadProfile();
    await loadPosts();
  });

  async function loadProfile() {
    try {
      const profile = await api.profiles.get(currentProfileId);

      const header = document.getElementById('profile-header');
      header.innerHTML = `
        <div class="profile-header-top">
          <div class="profile-avatar" style="background:${getRandomColor()}">
            ${getInitials(profile.username)}
          </div>
          <div class="profile-info">
            <h1>${profile.username}</h1>
            <div class="profile-username">@${profile.username}</div>
            ${profile.location ? `<div class="profile-location">📍 ${profile.location}</div>` : ''}
            ${profile.bio ? `<div class="profile-bio">${profile.bio}</div>` : ''}

            <div class="profile-stats">
              <div class="profile-stat">
                <div class="profile-stat-number">${profile.followersCount || 0}</div>
                <div class="profile-stat-label">Followers</div>
              </div>
              <div class="profile-stat">
                <div class="profile-stat-number">${profile.postsCount || 0}</div>
                <div class="profile-stat-label">Posts</div>
              </div>
            </div>

            <div class="profile-actions">
              ${isOwnProfile ? `
                <button class="btn btn-primary" onclick="document.getElementById('edit-form').style.display='block'">
                  ✏️ Éditer profil
                </button>
              ` : `
                <button class="btn btn-primary" onclick="followProfile()">👥 Suivre</button>
              `}
            </div>
          </div>
        </div>
      `;

      // Remplir form si proprio
      if (isOwnProfile) {
        document.getElementById('bio').value = profile.bio || '';
        document.getElementById('location').value = profile.location || '';
        document.getElementById('interests').value = (profile.interests || []).join(', ');

        document.getElementById('profile-form').addEventListener('submit', async e => {
          e.preventDefault();
          await updateProfile();
        });

        document.getElementById('bio').addEventListener('input', e => {
          document.getElementById('bio-count').textContent = e.target.value.length;
        });

        document.getElementById('bio-count').textContent = (profile.bio || '').length;

        document.getElementById('edit-form').style.display = 'block';
      }
    } catch (err) {
      document.getElementById('profile-header').innerHTML = '<div class="alert alert-error">Profil non trouvé</div>';
    }
  }

  async function loadPosts() {
    try {
      const response = await api.profiles.getPosts(currentProfileId, 50, 1);
      const posts = response || [];

      const container = document.getElementById('profile-posts-list');

      if (posts.length === 0) {
        container.innerHTML = '<div class="profile-posts-empty"><p>Aucun post pour le moment</p></div>';
        return;
      }

      container.innerHTML = posts.map(post => `
        <div class="post-card card">
          <div class="post-card-title">${post.title}</div>
          <div class="post-card-content">${post.content.substring(0, 200)}...</div>
          <div class="post-card-footer">
            <span>📅 ${formatDate(post.created_at)}</span>
            <span>❤️ ${post.likes_count}</span>
          </div>
        </div>
      `).join('');
    } catch (err) {
      console.error('Erreur chargement posts', err);
    }
  }

  async function updateProfile() {
    try {
      const bio = document.getElementById('bio').value;
      const location = document.getElementById('location').value;
      const interests = document.getElementById('interests').value
        .split(',')
        .map(s => s.trim())
        .filter(s => s);

      await api.profiles.update(currentProfileId, {
        bio: bio || null,
        location: location || null,
        interests,
      });

      store.updateProfile({ bio, location, interests });
      showToast('Profil mis à jour!', 'success');
      setTimeout(() => location.reload(), 1000);
    } catch (err) {
      showToast(err.data?.error || 'Erreur de mise à jour', 'error');
    }
  }

  function followProfile() {
    if (!isAuthenticated()) {
      navigate('/login');
      return;
    }

    api.profiles.follow(currentProfileId)
      .then(() => {
        showToast('Profil suivi!', 'success');
        location.reload();
      })
      .catch(err => {
        showToast(err.data?.error || 'Erreur', 'error');
      });
  }
</script>

</body>
</html>
