<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription — Citoyen Avisé</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .auth-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--gris-pale);
      padding: 20px;
    }

    .auth-card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      box-shadow: var(--ombre);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .auth-logo { font-size: 2.5rem; margin-bottom: 12px; }
    .auth-title { font-size: 1.6rem; font-weight: 700; color: var(--noir-doux); margin-bottom: 8px; }
    .auth-subtitle { color: var(--gris); font-size: 0.95rem; }

    .auth-form .form-group { margin-bottom: 16px; }
    .auth-form .btn { width: 100%; margin-top: 8px; }

    .password-strength {
      font-size: 0.8rem;
      margin-top: 4px;
      height: 4px;
      border-radius: 2px;
      background: #eee;
      overflow: hidden;
    }

    .password-strength-bar {
      height: 100%;
      width: 0%;
      transition: all 0.3s;
    }

    .password-strength-bar.weak { width: 33%; background: #dc3545; }
    .password-strength-bar.medium { width: 66%; background: #ffc107; }
    .password-strength-bar.strong { width: 100%; background: #28a745; }

    .auth-footer {
      text-align: center;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--gris-clair);
    }

    .auth-footer p {
      color: var(--gris);
      font-size: 0.95rem;
    }

    .auth-footer a {
      color: var(--rouge);
      text-decoration: none;
      font-weight: 600;
    }

    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">🍁</div>
      <h1 class="auth-title">S'inscrire</h1>
      <p class="auth-subtitle">Rejoignez Citoyen Avisé</p>
    </div>

    <form class="auth-form" id="register-form">
      <div class="form-group">
        <label for="username" class="form-label">Nom d'utilisateur</label>
        <input
          type="text"
          id="username"
          class="form-control"
          placeholder="jean_db"
          required
        >
        <div class="form-error" id="username-error"></div>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input
          type="email"
          id="email"
          class="form-control"
          placeholder="votre@email.com"
          required
        >
        <div class="form-error" id="email-error"></div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Mot de passe</label>
        <input
          type="password"
          id="password"
          class="form-control"
          placeholder="••••••••"
          required
        >
        <div class="password-strength">
          <div class="password-strength-bar" id="strength-bar"></div>
        </div>
        <div class="form-error" id="password-error" style="font-size: 0.8rem; margin-top: 8px;"></div>
      </div>

      <div id="form-error" class="alert alert-error" style="display:none;"></div>

      <button type="submit" class="btn btn-primary btn-lg" id="submit-btn">
        S'inscrire
      </button>
    </form>

    <div class="auth-footer">
      <p>Déjà inscrit ? <a href="/login">Se connecter</a></p>
    </div>
  </div>
</div>

<script src="/js/utils/api.js"></script>
<script src="/js/utils/store.js"></script>
<script src="/js/utils/helpers.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (isAuthenticated()) {
      navigate('/');
      return;
    }

    const form = document.getElementById('register-form');
    const passwordInput = document.getElementById('password');
    const strengthBar = document.getElementById('strength-bar');
    const submitBtn = document.getElementById('submit-btn');
    const formError = document.getElementById('form-error');

    // Indicateur force password
    passwordInput.addEventListener('input', e => {
      const pwd = e.target.value;
      let strength = 'weak';

      if (pwd.length >= 8 && /[A-Z]/.test(pwd) && /[0-9]/.test(pwd)) {
        strength = 'strong';
      } else if (pwd.length >= 6) {
        strength = 'medium';
      }

      strengthBar.className = `password-strength-bar ${strength}`;
    });

    form.addEventListener('submit', async e => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Validation
      const errors = {};

      if (!username || username.length < 3) {
        errors.username = 'Min 3 caractères';
      }

      if (!isValidEmail(email)) {
        errors.email = 'Email invalide';
      }

      if (!password || password.length < 8) {
        errors.password = 'Min 8 caractères';
      } else if (!/[A-Z]/.test(password)) {
        errors.password = 'Une majuscule requise';
      }

      if (Object.keys(errors).length > 0) {
        formError.innerHTML = Object.values(errors).join('<br>');
        formError.style.display = 'block';
        return;
      }

      try {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner loading-spinner"></span>Inscription...';
        formError.style.display = 'none';

        const result = await api.auth.register(email, password, username);

        api.setToken(result.token);
        store.setUser(result.user, result.profile);

        showToast('Bienvenue sur Citoyen Avisé!', 'success');
        setTimeout(() => navigate('/profile'), 1000);
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'S\'inscrire';
        formError.textContent = err.data?.error || 'Erreur d\'inscription';
        formError.style.display = 'block';
      }
    });
  });
</script>

</body>
</html>
