<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="api-url" content=""><!-- Déterminé dynamiquement par api.js -->
  <title>Espace Idées — Citoyen Avisé</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .ideas-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 24px;
    }

    .ideas-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .ideas-header h1 {
      margin-bottom: 8px;
      color: var(--noir-doux);
    }

    .ideas-header p {
      color: var(--gris-texte);
      font-size: 1.05rem;
    }

    /* Section création */
    #create-section {
      background: var(--gris-pale);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 32px;
      display: none;
    }

    #create-section.visible {
      display: block;
    }

    .create-form-group {
      margin-bottom: 16px;
    }

    .create-form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--noir-doux);
      font-size: 0.9rem;
    }

    .create-form-group input,
    .create-form-group textarea,
    .create-form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--gris-clair);
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .create-form-group input:focus,
    .create-form-group textarea:focus,
    .create-form-group select:focus {
      outline: none;
      border-color: var(--rouge);
      box-shadow: 0 0 0 3px rgba(193, 39, 45, 0.1);
    }

    .create-form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .create-button {
      width: 100%;
      padding: 12px;
      background: var(--rouge);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .create-button:hover {
      background: var(--rouge-fonce);
      transform: translateY(-1px);
    }

    .create-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Onglets tri */
    .ideas-sort-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--gris-clair);
    }

    .sort-tab {
      padding: 12px 16px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--gris-texte);
      transition: all 0.2s;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
    }

    .sort-tab:hover {
      color: var(--noir-doux);
    }

    .sort-tab.active {
      color: var(--rouge);
      border-bottom-color: var(--rouge);
    }

    /* Widget populaire */
    .ideas-popular-widget {
      background: linear-gradient(135deg, var(--rouge-clair) 0%, var(--gris-pale) 100%);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 32px;
      border-left: 4px solid var(--rouge);
    }

    .popular-widget-title {
      font-weight: 700;
      font-size: 1rem;
      color: var(--noir-doux);
      margin-bottom: 16px;
    }

    .popular-idea-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--gris-clair);
      cursor: pointer;
      transition: all 0.2s;
    }

    .popular-idea-item:hover {
      padding-left: 4px;
      color: var(--rouge);
    }

    .popular-idea-item:last-child {
      border: none;
    }

    .popular-idea-title {
      flex: 1;
      font-size: 0.95rem;
      font-weight: 500;
      color: inherit;
    }

    .popular-idea-likes {
      color: var(--rouge);
      font-weight: 700;
      white-space: nowrap;
      margin-left: 12px;
    }

    /* Cards idées */
    .ideas-list {
      margin-bottom: 32px;
    }

    .idea-card {
      background: white;
      border: 1px solid var(--gris-clair);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
      transition: all 0.2s;
    }

    .idea-card:hover {
      border-color: var(--rouge);
      box-shadow: 0 4px 12px rgba(193, 39, 45, 0.1);
    }

    .idea-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .idea-card-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--rouge);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .idea-card-author {
      font-weight: 600;
      flex: 1;
      color: var(--noir-doux);
    }

    .idea-card-date {
      font-size: 0.8rem;
      color: var(--gris);
    }

    .idea-card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--noir-doux);
      line-height: 1.4;
    }

    .idea-card-content {
      font-size: 0.95rem;
      color: var(--gris-texte);
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .idea-card-category {
      display: inline-block;
      padding: 4px 10px;
      background: var(--gris-pale);
      color: var(--gris-texte);
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .idea-card-footer {
      display: flex;
      gap: 16px;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid var(--gris-clair);
    }

    .idea-like-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--gris);
      font-weight: 600;
      transition: all 0.2s;
      border: none;
      background: transparent;
      padding: 0;
      font-size: 0.9rem;
    }

    .idea-like-btn:hover {
      color: var(--rouge);
    }

    .idea-like-btn.liked {
      color: var(--rouge);
    }

    /* Pagination */
    .pagination {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 32px;
    }

    .pagination button,
    .pagination a {
      padding: 8px 12px;
      border: 1px solid var(--gris-clair);
      border-radius: 4px;
      background: white;
      color: var(--rouge);
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
      text-decoration: none;
    }

    .pagination button:hover,
    .pagination a:hover {
      border-color: var(--rouge);
      background: var(--rouge-clair);
    }

    .pagination .active {
      background: var(--rouge);
      color: white;
      border-color: var(--rouge);
    }

    .pagination .disabled {
      color: var(--gris);
      cursor: not-allowed;
      opacity: 0.5;
    }

    /* Empty state */
    .ideas-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--gris);
    }

    .ideas-empty p {
      margin: 0;
    }

    @media (max-width: 768px) {
      .ideas-container {
        padding: 16px;
      }

      .ideas-header h1 {
        font-size: 1.8rem;
      }

      .ideas-sort-tabs {
        overflow-x: auto;
        margin-bottom: 16px;
      }

      .sort-tab {
        padding: 10px 14px;
        font-size: 0.9rem;
        white-space: nowrap;
      }

      .popular-idea-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .popular-idea-likes {
        margin-left: 0;
        margin-top: 4px;
      }
    }
  </style>
</head>
<body>

<div class="ideas-container">
  <div class="ideas-header">
    <h1>Espace Idées</h1>
    <p>Proposez vos idées et votez pour celles qui vous inspirent</p>
  </div>

  <!-- Section création -->
  <div id="create-section">
    <h2 style="margin-bottom: 20px; font-size: 1.1rem;">Proposer une idée</h2>

    <form id="create-form">
      <div class="create-form-group">
        <label for="idea-title">Titre de l'idée</label>
        <input type="text" id="idea-title" placeholder="Décrivez brièvement votre idée..." required>
      </div>

      <div class="create-form-group">
        <label for="idea-content">Description détaillée</label>
        <textarea id="idea-content" placeholder="Expliquez votre idée en détail..." required></textarea>
      </div>

      <div class="create-form-group">
        <label for="idea-category">Catégorie</label>
        <select id="idea-category" required>
          <option value="">— Choisir une catégorie —</option>
          <option value="élections">🗳️ Élections</option>
          <option value="gouvernement">🏛️ Gouvernement</option>
          <option value="droits">⚖️ Droits</option>
          <option value="services">💼 Services</option>
          <option value="santé">🏥 Santé</option>
          <option value="éducation">📚 Éducation</option>
          <option value="environnement">🌍 Environnement</option>
          <option value="économie">💰 Économie</option>
          <option value="autres">📌 Autres</option>
        </select>
      </div>

      <button type="submit" class="create-button">Publier mon idée</button>
    </form>
  </div>

  <!-- Onglets tri -->
  <div class="ideas-sort-tabs">
    <button class="sort-tab active" data-sort="latest">📅 Récentes</button>
    <button class="sort-tab" data-sort="popular">❤️ Populaires</button>
  </div>

  <!-- Widget idées populaires -->
  <div class="ideas-popular-widget" id="popular-widget" style="display: none;">
    <div class="popular-widget-title">✨ Tendances du moment</div>
    <div id="popular-ideas-container"><!-- chargé dynamiquement --></div>
  </div>

  <!-- Liste idées -->
  <div class="ideas-list" id="ideas-list">
    <div class="ideas-empty"><p>Chargement des idées...</p></div>
  </div>

  <!-- Pagination -->
  <div class="pagination" id="pagination"></div>
</div>

<!-- Configuration (doit être première) -->
<script src="/js/config.js"></script>

<!-- Scripts -->
<script src="/js/utils/api.js"></script>
<script src="/js/utils/store.js"></script>
<script src="/js/utils/helpers.js"></script>
<script src="/js/components/header.js"></script>

<script>
  let currentPage = 1;
  let currentSort = 'latest';
  let likedIdeas = new Set();

  document.addEventListener('DOMContentLoaded', async () => {
    // Initialiser header
    initHeader();

    // Afficher section création si authentifié
    if (isAuthenticated()) {
      document.getElementById('create-section').classList.add('visible');
    }

    // Event listeners
    document.getElementById('create-form').addEventListener('submit', handleCreateIdea);

    document.querySelectorAll('.sort-tab').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.sort-tab').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentSort = e.target.dataset.sort;
        currentPage = 1;
        updateIdeasDisplay();
      });
    });

    // Charger idées et widget
    await loadPopularWidget();
    await loadIdeas();
  });

  async function loadIdeas() {
    try {
      const response = await api.ideas.list(10, currentPage, null, currentSort);
      const { data, meta } = response;

      if (data.length === 0) {
        document.getElementById('ideas-list').innerHTML = '<div class="ideas-empty"><p>Aucune idée pour le moment</p></div>';
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      // Charger état des likes pour cette page
      const userId = getCurrentUserId();
      if (userId) {
        // Note: Dans un vrai système, il faudrait récupérer l'état des likes du serveur
        // Pour le MVP, on se fie au Set local (perdu au reload)
      }

      // Rendre les cartes
      document.getElementById('ideas-list').innerHTML = data.map(idea => {
        const isLiked = likedIdeas.has(idea.id);
        return `
          <div class="idea-card">
            <div class="idea-card-header">
              <div class="idea-card-avatar" style="background: ${getRandomColor()}">
                ${getInitials(idea.creator.username)}
              </div>
              <div>
                <div class="idea-card-author">${idea.creator.username}</div>
                <div class="idea-card-date">${formatDate(idea.createdAt)}</div>
              </div>
            </div>

            <div class="idea-card-title">${idea.title}</div>
            <div class="idea-card-content">${truncate(idea.content, 200)}</div>
            <div class="idea-card-category">📂 ${idea.category}</div>

            <div class="idea-card-footer">
              <button class="idea-like-btn ${isLiked ? 'liked' : ''}" data-id="${idea.id}" data-liked="${isLiked}">
                <span>${isLiked ? '❤️' : '🤍'}</span>
                <span>${idea.likesCount}</span>
              </button>
            </div>
          </div>
        `;
      }).join('');

      // Ajouter event listeners aux boutons like
      document.querySelectorAll('.idea-like-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          const ideaId = btn.dataset.id;
          const isLiked = btn.dataset.liked === 'true';
          toggleLike(ideaId, isLiked);
        });
      });

      // Rendre pagination
      renderPagination(meta);
    } catch (err) {
      console.error('Erreur chargement idées', err);
      document.getElementById('ideas-list').innerHTML = '<div class="ideas-empty"><p>Erreur de chargement</p></div>';
    }
  }

  async function loadPopularWidget() {
    try {
      const response = await api.ideas.getPopular(3);
      const ideas = response.data || [];

      if (ideas.length === 0) {
        document.getElementById('popular-widget').style.display = 'none';
        return;
      }

      document.getElementById('popular-widget').style.display = 'block';
      document.getElementById('popular-ideas-container').innerHTML = ideas.map(idea => `
        <div class="popular-idea-item" onclick="navigate('/ideas'); return false;">
          <div class="popular-idea-title">${truncate(idea.title, 50)}</div>
          <div class="popular-idea-likes">❤️ ${idea.likesCount}</div>
        </div>
      `).join('');
    } catch (err) {
      console.error('Erreur widget populaire', err);
      document.getElementById('popular-widget').style.display = 'none';
    }
  }

  async function toggleLike(ideaId, isLiked) {
    if (!isAuthenticated()) {
      navigate('/login');
      return;
    }

    try {
      if (isLiked) {
        await api.ideas.unlike(ideaId);
        likedIdeas.delete(ideaId);
      } else {
        await api.ideas.like(ideaId);
        likedIdeas.add(ideaId);
      }

      // Recharger la liste (MVP: rechargement complet)
      await loadIdeas();
    } catch (err) {
      console.error('Erreur like/unlike', err);
      showToast('Erreur lors du vote', 'error');
    }
  }

  async function handleCreateIdea(e) {
    e.preventDefault();

    const title = document.getElementById('idea-title').value;
    const content = document.getElementById('idea-content').value;
    const category = document.getElementById('idea-category').value;

    if (!title || !content || !category) {
      showToast('Veuillez remplir tous les champs', 'warning');
      return;
    }

    try {
      const btn = e.target.querySelector('button');
      btn.disabled = true;

      await api.ideas.create({ title, content, category });

      showToast('Idée publiée! ✨', 'success');
      document.getElementById('create-form').reset();
      currentPage = 1;
      currentSort = 'latest';
      document.querySelector('[data-sort="latest"]').click();
      await loadIdeas();

      btn.disabled = false;
    } catch (err) {
      console.error('Erreur création idée', err);
      showToast(err.message || 'Erreur lors de la publication', 'error');
      e.target.querySelector('button').disabled = false;
    }
  }

  function renderPagination(meta) {
    if (meta.pages <= 1) {
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    let html = '';

    // Bouton précédent
    if (currentPage > 1) {
      html += `<button onclick="goToPage(${currentPage - 1})">← Précédent</button>`;
    } else {
      html += `<button class="disabled" disabled>← Précédent</button>`;
    }

    // Numéros de page
    for (let i = 1; i <= meta.pages; i++) {
      if (i === currentPage) {
        html += `<button class="active">${i}</button>`;
      } else if (i <= 3 || i > meta.pages - 2 || Math.abs(i - currentPage) <= 1) {
        html += `<button onclick="goToPage(${i})">${i}</button>`;
      } else if (i === 4 && currentPage > 3) {
        html += `<button class="disabled" disabled>...</button>`;
      }
    }

    // Bouton suivant
    if (currentPage < meta.pages) {
      html += `<button onclick="goToPage(${currentPage + 1})">Suivant →</button>`;
    } else {
      html += `<button class="disabled" disabled>Suivant →</button>`;
    }

    document.getElementById('pagination').innerHTML = html;
  }

  function goToPage(page) {
    currentPage = page;
    updateIdeasDisplay();
    window.scrollTo(0, 0);
  }

  async function updateIdeasDisplay() {
    document.getElementById('popular-widget').style.display = currentSort === 'latest' ? 'block' : 'none';
    await loadIdeas();
  }
</script>

</body>
</html>
