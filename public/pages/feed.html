<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="api-url" content=""><!-- Déterminé dynamiquement par api.js -->
  <title>Fil d'actualité — Citoyen Avisé</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .feed-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    .feed-header {
      margin-bottom: 30px;
    }

    .feed-header h1 {
      font-size: 2rem;
      margin-bottom: 12px;
    }

    .feed-filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .feed-filters button {
      padding: 8px 16px;
      border: 1px solid var(--gris-clair);
      background: white;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9rem;
    }

    .feed-filters button.active {
      background: var(--rouge);
      color: white;
      border-color: var(--rouge);
    }

    .feed-create {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: var(--ombre-carte);
    }

    .feed-create-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .feed-create-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--rouge);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .feed-create-user {
      font-weight: 600;
    }

    .feed-create-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .feed-create-type {
      display: flex;
      gap: 8px;
    }

    .feed-create-type button {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--gris-clair);
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .feed-create-type button.selected {
      background: var(--rouge-clair);
      border-color: var(--rouge);
      color: var(--rouge);
      font-weight: 600;
    }

    .feed-posts {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .feed-post {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--ombre-carte);
      transition: all 0.3s;
    }

    .feed-post:hover {
      box-shadow: var(--ombre);
    }

    .feed-post-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .feed-post-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--rouge);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      flex-shrink: 0;
    }

    .feed-post-info {
      flex: 1;
    }

    .feed-post-author {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .feed-post-meta {
      font-size: 0.8rem;
      color: var(--gris);
    }

    .feed-post-type {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 600;
      background: var(--rouge-clair);
      color: var(--rouge);
    }

    .feed-post-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--noir-doux);
    }

    .feed-post-content {
      color: var(--gris-texte);
      line-height: 1.6;
      margin-bottom: 12px;
    }

    .feed-post-footer {
      display: flex;
      gap: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--gris-clair);
      font-size: 0.9rem;
      align-items: center;
    }

    .feed-post-action {
      cursor: pointer;
      color: var(--gris);
      transition: color 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .feed-post-action:hover {
      color: var(--rouge);
    }

    .feed-post-action.liked {
      color: var(--rouge);
    }

    .feed-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--gris);
    }

    .pagination {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .pagination button {
      padding: 8px 12px;
      border: 1px solid var(--gris-clair);
      background: white;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pagination button:hover {
      background: var(--gris-pale);
    }

    .pagination button.active {
      background: var(--rouge);
      color: white;
      border-color: var(--rouge);
    }
  </style>
</head>
<body>

<div class="feed-container">
  <div class="feed-header">
    <h1>Fil d'actualité</h1>
    <p style="color: var(--gris); margin-bottom: 20px;">Découvrez les idées et discussions des citoyens</p>
  </div>

  <!-- Créer un post (si connecté) -->
  <div class="feed-create" id="create-section" style="display:none;">
    <div class="feed-create-header">
      <div class="feed-create-avatar" id="create-avatar">?</div>
      <div class="feed-create-user" id="create-user">User</div>
    </div>

    <form id="post-form" class="feed-create-form">
      <div class="form-group">
        <input
          type="text"
          id="post-title"
          class="form-control"
          placeholder="Titre de votre post..."
          required
        >
      </div>

      <div class="form-group">
        <textarea
          id="post-content"
          class="form-control"
          placeholder="Partagez votre idée, question ou discussion..."
          required
          rows="4"
        ></textarea>
      </div>

      <div class="feed-create-type">
        <button type="button" class="type-btn selected" data-type="idea">💡 Idée</button>
        <button type="button" class="type-btn" data-type="question">❓ Question</button>
        <button type="button" class="type-btn" data-type="discussion">💬 Discussion</button>
        <button type="button" class="type-btn" data-type="proposal">✅ Proposition</button>
      </div>

      <div class="form-group">
        <select id="post-category" class="form-control" required>
          <option value="">Catégorie...</option>
          <option value="élections">🗳️ Élections</option>
          <option value="gouvernement">🏛️ Gouvernement</option>
          <option value="droits">⚖️ Droits</option>
          <option value="services">🛎️ Services</option>
          <option value="santé">🏥 Santé</option>
          <option value="éducation">📚 Éducation</option>
          <option value="environnement">🌍 Environnement</option>
          <option value="économie">💰 Économie</option>
          <option value="autres">📌 Autres</option>
        </select>
      </div>

      <div style="display:flex;gap:12px;">
        <button type="submit" class="btn btn-primary">Publier</button>
        <button type="reset" class="btn btn-secondary">Annuler</button>
      </div>
    </form>
  </div>

  <!-- Filtres -->
  <div class="feed-filters">
    <button class="filter-btn active" data-filter="all">Tous</button>
    <button class="filter-btn" data-filter="idea">💡 Idées</button>
    <button class="filter-btn" data-filter="question">❓ Questions</button>
    <button class="filter-btn" data-filter="discussion">💬 Discussions</button>
  </div>

  <!-- Posts -->
  <div class="feed-posts" id="posts-list">
    <div class="loader" style="padding:40px;">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Pagination -->
  <div class="pagination" id="pagination"></div>
</div>

<!-- Configuration (doit être première) -->
<script src="/js/config.js"></script>

<!-- Scripts -->
<script src="/js/utils/api.js"></script>
<script src="/js/utils/store.js"></script>
<script src="/js/utils/helpers.js"></script>
<script src="/js/components/header.js"></script>
<script>
  let currentPage = 1;
  let currentFilter = 'all';
  let selectedType = 'idea';
  let likedPosts = new Set();

  document.addEventListener('DOMContentLoaded', async () => {
    initHeader();

    // Vérifier authentification
    if (isAuthenticated()) {
      const user = store.getUser();
      document.getElementById('create-section').style.display = 'block';
      document.getElementById('create-avatar').textContent = getInitials(user.username);
      document.getElementById('create-avatar').style.background = getRandomColor();
      document.getElementById('create-user').textContent = user.username;

      // Event listeners form
      document.querySelectorAll('.type-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.preventDefault();
          document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedType = btn.dataset.type;
        });
      });

      document.getElementById('post-form').addEventListener('submit', async e => {
        e.preventDefault();
        await createPost();
      });
    }

    // Filtres
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        currentPage = 1;
        loadPosts();
      });
    });

    await loadPosts();
  });

  async function loadPosts() {
    try {
      const response = await api.posts.list(
        10,
        currentPage,
        null,
        currentFilter === 'all' ? null : currentFilter
      );

      const posts = response.data || [];
      const totalPages = response.meta?.pages || 1;

      const container = document.getElementById('posts-list');

      if (posts.length === 0) {
        container.innerHTML = '<div class="feed-empty"><p>Aucun post pour le moment</p></div>';
      } else {
        container.innerHTML = posts.map(post => {
          const isLiked = likedPosts.has(post.id);
          return `
            <div class="feed-post" id="post-${post.id}">
              <div class="feed-post-header">
                <div class="feed-post-avatar" style="background:${getRandomColor()}">${getInitials(post.creator.username)}</div>
                <div class="feed-post-info">
                  <div class="feed-post-author">${post.creator.username}</div>
                  <div class="feed-post-meta">${formatDate(post.createdAt)}</div>
                </div>
                <span class="feed-post-type">${capitalize(post.type)}</span>
              </div>

              <div class="feed-post-title">${post.title}</div>
              <div class="feed-post-content">${post.content.substring(0, 300)}...</div>

              <div class="feed-post-footer">
                <div class="feed-post-action like-btn" data-id="${post.id}" data-liked="${isLiked}">
                  <span>${isLiked ? '❤️' : '🤍'}</span>
                  <span>${post.likesCount}</span>
                </div>
                <div style="margin-left: auto; font-size: 0.8rem; color: var(--gris);">
                  ${post.category ? `<span>#${post.category}</span>` : ''}
                </div>
              </div>
            </div>
          `;
        }).join('');

        // Event listeners likes
        document.querySelectorAll('.like-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!isAuthenticated()) {
              navigate('/login');
              return;
            }
            await toggleLike(btn.dataset.id, btn.dataset.liked === 'true');
          });
        });
      }

      // Pagination
      const pagination = document.getElementById('pagination');
      pagination.innerHTML = '';
      for (let i = 1; i <= totalPages; i++) {
        const pageBtn = document.createElement('button');
        pageBtn.textContent = i;
        if (i === currentPage) pageBtn.classList.add('active');
        pageBtn.addEventListener('click', () => {
          currentPage = i;
          loadPosts();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        pagination.appendChild(pageBtn);
      }
    } catch (err) {
      console.error('Erreur chargement posts', err);
      document.getElementById('posts-list').innerHTML = '<div class="alert alert-error">Erreur de chargement</div>';
    }
  }

  async function createPost() {
    try {
      const title = document.getElementById('post-title').value;
      const content = document.getElementById('post-content').value;
      const category = document.getElementById('post-category').value;

      if (!title || !content || !category) {
        showToast('Remplissez tous les champs', 'warning');
        return;
      }

      await api.posts.create({
        title,
        content,
        type: selectedType,
        category,
      });

      showToast('Post publié!', 'success');
      document.getElementById('post-form').reset();
      currentPage = 1;
      await loadPosts();
    } catch (err) {
      showToast(err.data?.error || 'Erreur de publication', 'error');
    }
  }

  async function toggleLike(postId, isLiked) {
    try {
      if (isLiked) {
        await api.posts.unlike(postId);
        likedPosts.delete(postId);
      } else {
        await api.posts.like(postId);
        likedPosts.add(postId);
      }
      await loadPosts();
    } catch (err) {
      showToast(err.data?.error || 'Erreur', 'error');
    }
  }
</script>

</body>
</html>
