<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Citoyen Avisé</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .auth-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--gris-pale);
      padding: 20px;
    }

    .auth-card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      box-shadow: var(--ombre);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .auth-logo {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    .auth-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--noir-doux);
      margin-bottom: 8px;
    }

    .auth-subtitle {
      color: var(--gris);
      font-size: 0.95rem;
    }

    .auth-form .form-group {
      margin-bottom: 16px;
    }

    .auth-form .btn {
      width: 100%;
      margin-top: 8px;
    }

    .auth-footer {
      text-align: center;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--gris-clair);
    }

    .auth-footer p {
      color: var(--gris);
      font-size: 0.95rem;
    }

    .auth-footer a {
      color: var(--rouge);
      text-decoration: none;
      font-weight: 600;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    .loading-spinner {
      display: inline-block;
      margin-right: 8px;
    }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">🍁</div>
      <h1 class="auth-title">Connexion</h1>
      <p class="auth-subtitle">Accédez à Citoyen Avisé</p>
    </div>

    <form class="auth-form" id="login-form">
      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input
          type="email"
          id="email"
          class="form-control"
          placeholder="votre@email.com"
          required
        >
        <div class="form-error" id="email-error"></div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Mot de passe</label>
        <input
          type="password"
          id="password"
          class="form-control"
          placeholder="••••••••"
          required
        >
        <div class="form-error" id="password-error"></div>
      </div>

      <div id="form-error" class="alert alert-error" style="display:none;"></div>

      <button type="submit" class="btn btn-primary btn-lg" id="submit-btn">
        Se connecter
      </button>
    </form>

    <div class="auth-footer">
      <p>Pas encore inscrit ? <a href="/register">Créer un compte</a></p>
    </div>
  </div>
</div>

<script src="/js/utils/api.js"></script>
<script src="/js/utils/store.js"></script>
<script src="/js/utils/helpers.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Vérifier si déjà connecté
    if (isAuthenticated()) {
      navigate('/');
      return;
    }

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const formError = document.getElementById('form-error');

    form.addEventListener('submit', async e => {
      e.preventDefault();

      // Récupérer valeurs
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Valider
      if (!email || !password) {
        formError.textContent = 'Email et mot de passe requis';
        formError.style.display = 'block';
        return;
      }

      if (!isValidEmail(email)) {
        formError.textContent = 'Email invalide';
        formError.style.display = 'block';
        return;
      }

      try {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner loading-spinner"></span>Connexion...';
        formError.style.display = 'none';

        // Appel API
        const result = await api.auth.login(email, password);

        // Sauvegarder token et user
        api.setToken(result.token);
        store.setUser(result.user, result.user.profile || {});

        showToast('Connexion réussie!', 'success');
        setTimeout(() => navigate('/'), 1000);
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Se connecter';
        formError.textContent = err.data?.error || 'Erreur de connexion';
        formError.style.display = 'block';
      }
    });
  });
</script>

</body>
</html>
