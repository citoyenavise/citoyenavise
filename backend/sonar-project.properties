# SonarQube Configuration for Citoyenavise Backend

# Project identification
sonar.projectKey=citoyenavise-backend
sonar.projectName=Citoyenavise Backend API
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=src
sonar.tests=__tests__
sonar.sourceEncoding=UTF-8

# Language
sonar.language=js

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.js,**/__tests__/**,**/node_modules/**,**/dist/**
sonar.test.inclusions=**/*.test.js,**/__tests__/**/*.js

# Quality gate
sonar.qualitygate.wait=true

# Duplication
sonar.cpd.exclusions=**/*.test.js,**/node_modules/**

# Code smells and bugs
sonar.javascript.file.suffixes=.js

# Exclusions
sonar.exclusions=node_modules/**,coverage/**,dist/**,.git/**

# Security
sonar.security.hotspots.skip=false
