version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: citoyenavise_pg
    environment:
      POSTGRES_USER: citoyenavise
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: citoyenavise_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citoyenavise"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: citoyenavise_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://citoyenavise:dev_password@postgres:5432/citoyenavise_dev
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    command: npm run dev

volumes:
  postgres_data:
